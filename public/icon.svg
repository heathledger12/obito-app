<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D24" />
      <stop offset="50%" stop-color="#0F1738" />
      <stop offset="100%" stop-color="#050817" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Outer glowing border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#primary-grad)" stroke-width="4" opacity="0.6" />

  <!-- Ambient glow backdrop -->
  <circle cx="256" cy="240" r="140" fill="#06B6D4" opacity="0.15" filter="url(#glow)" />
  <circle cx="280" cy="270" r="130" fill="#A855F7" opacity="0.15" filter="url(#glow)" />

  <!-- Main Opinion Bubble with modern curves -->
  <g filter="url(#glow)">
    <path d="M128 152 C128 116.65 156.65 88 192 88 L320 88 C355.35 88 384 116.65 384 152 L384 272 C384 307.35 355.35 336 320 336 L216 336 L152 392 L164 336 L192 336 C156.65 336 128 307.35 128 272 Z"
          fill="url(#primary-grad)" />
  </g>

  <!-- Inside speech bubble cutout/dark card -->
  <path d="M148 162 C148 135.49 169.49 114 196 114 L316 114 C342.51 114 364 135.49 364 162 L364 262 C364 288.51 342.51 310 316 310 L212 310 L168 348 L176 310 L196 310 C169.49 310 148 288.51 148 262 Z"
        fill="#080D24" />

  <!-- Opinion lines inside bubble -->
  <rect x="188" y="164" width="136" height="14" rx="7" fill="url(#accent-grad)" />
  <rect x="188" y="196" width="104" height="14" rx="7" fill="#38BDF8" opacity="0.85" />
  <rect x="188" y="228" width="72" height="14" rx="7" fill="#C084FC" opacity="0.85" />

  <!-- Star / Sparkle Accent -->
  <path d="M344 120 L350 136 L366 142 L350 148 L344 164 L338 148 L322 142 L338 136 Z" fill="#67E8F9" />
  <path d="M140 280 L144 290 L154 294 L144 298 L140 308 L136 298 L126 294 L136 290 Z" fill="#E879F9" />

  <!-- Bottom Brand Subtitle Text "KISHORE OPINION" -->
  <text x="256" y="440" font-family="'Poppins', sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    KISHORE OPINION
  </text>
  <text x="256" y="468" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="3">
    VOICE OF THE FUTURE
  </text>
</svg>
